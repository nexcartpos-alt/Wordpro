name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile (Java 8 compatible)
        run: |
          mkdir -p classes
          javac -encoding UTF-8 --release 8 -d classes src/wordpro/*.java
